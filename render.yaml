services:
  - type: web
    name: diabetes-awareness-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 run:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: diabetes-awareness-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: WHATSAPP_DRY_RUN
        value: "true"
      - key: WHATSAPP_GRAPH_API_VERSION
        value: "v23.0"
      - key: WHATSAPP_ASSESSMENT_TEMPLATE_NAME
        value: "diabetes_assessment_result"
      - key: WHATSAPP_RAMADAN_TEMPLATE_NAME
        value: "ramadan_awareness"
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: "en"
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: diabetes-awareness-db
    plan: free
    databaseName: diabetes_awareness
    user: diabetes_awareness_user
